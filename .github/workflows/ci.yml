name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: CI validation
    runs-on: ubuntu-24.04
    environment: staging
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.4.2
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: local
      GRAFANA_ADMIN_PASSWORD: ci-placeholder-only
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      POSTGRES_PASSWORD: ci-placeholder-only
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_DRIVER: filesystem
      OBJECT_STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /tmp/balance-ci-storage
      OBJECT_STORAGE_FILESYSTEM_ROOT: /tmp/balance-ci-storage
      QUEUE_PROOF_NAME: queue_proof
      EXTRACTION_QUEUE_NAME: document_extract
      OCR_PROVIDER: paddleocr
      EXTRACTION_PROVIDER_DEFAULT: paddleocr
      EXTRACTION_ALLOW_LEGACY_TEXTRACT: "false"
      SEED_CONSUMER_PASSWORD: ci-consumer-password
      SEED_STAFF_PASSWORD: ci-staff-password
      SEED_REVIEWER_PASSWORD: ci-reviewer-password
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_SYSTEM_ADMIN_PASSWORD: ci-system-admin-password
      APP_VERSION: ${{ vars.APP_VERSION || '0.6.0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10.33.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Cache Turborepo data
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Gitleaks and OSV-Scanner
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned Semgrep
        run: pipx install semgrep==1.145.0

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Prisma migrate deploy
        run: pnpm prisma:deploy

      - name: Prisma seed
        run: pnpm prisma:seed

      - name: Gitleaks gate
        run: bash scripts/security/gitleaks.sh

      - name: OSV-Scanner gate
        run: bash scripts/security/osv.sh

      - name: Trivy filesystem gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-dirs: .git,docs,legacy,node_modules

      - name: Semgrep gate
        run: bash scripts/security/semgrep.sh

      - name: Prisma raw-query gate
        run: bash scripts/security/prisma.sh

      - name: Hadolint gate
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          recursive: true
          failure-threshold: warning

      - name: Route policy inventory gate
        run: bash scripts/verify/route-inventory.sh

      - name: Authentication gate
        run: bash scripts/verify/auth.sh

      - name: Authorization gate
        run: bash scripts/verify/authz.sh

      - name: Upload gate
        run: bash scripts/verify/upload.sh

      - name: Generate pinned Syft SBOM artifact
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          artifact-name: balance-sbom.cdx.json
          output-file: artifacts/balance-sbom.cdx.json
          format: cyclonedx-json
          syft-version: 1.44.0
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build worker Docker image
        run: docker build -f services/worker/Dockerfile -t balance-worker:validation .

      - name: Compile worker Python sources
        run: docker run --rm balance-worker:validation python -m compileall app

      - name: Build
        run: pnpm build

      - name: Validate local Compose file
        run: docker compose -f infra/compose/compose.local.yml config

      - name: Validate queue proof
        run: bash scripts/verify/queue.sh

      - name: Validate worker extraction proof
        run: bash scripts/verify/extraction.sh
