global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: balance-local

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: balance-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3001

  - job_name: balance-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8000

  - job_name: balance-web
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - web:3000

  - job_name: balance-gatus
    metrics_path: /metrics
    static_configs:
      - targets:
          - gatus:8080

  - job_name: balance-grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: balance-loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100

  - job_name: balance-tempo
    metrics_path: /metrics
    static_configs:
      - targets:
          - tempo:3200

  - job_name: balance-pyroscope
    metrics_path: /metrics
    static_configs:
      - targets:
          - pyroscope:4040

  - job_name: balance-alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - alloy:12345

  - job_name: balance-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: balance-redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: balance-blackbox
    static_configs:
      - targets:
          - blackbox-exporter:9115
