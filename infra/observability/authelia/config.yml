theme: auto

server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

totp:
  issuer: Balance

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain:
        - grafana.{{ env "BALANCE_BASE_DOMAIN" | default "localhost.localdomain" }}
      policy: one_factor

session:
  name: balance_observability_session
  cookies:
    - domain: {{ env "BALANCE_BASE_DOMAIN" | default "localhost.localdomain" }}
      authelia_url: https://auth.{{ env "BALANCE_BASE_DOMAIN" | default "localhost.localdomain" }}
      default_redirection_url: https://grafana.{{ env "BALANCE_BASE_DOMAIN" | default "localhost.localdomain" }}

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
