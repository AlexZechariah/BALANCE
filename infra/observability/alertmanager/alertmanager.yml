global:
  resolve_timeout: 5m

route:
  receiver: ntfy-local
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ntfy-local
    webhook_configs:
      - url: http://ntfy/balance-alerts?title=Balance%20local%20alert&priority=default&tags=warning&cache=no&firebase=no
        send_resolved: true
        max_alerts: 5
